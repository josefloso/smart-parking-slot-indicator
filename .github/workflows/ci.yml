name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r tests/requirements.txt
      - name: Database tests
        run: pytest tests/unit -v
      - name: Node-RED function tests
        run: node --test tests/unit/*.test.js

  integration:
    name: System integration tests (MQTT -> Node-RED -> SQLite)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: pytest tests/integration -v

  firmware:
    name: Firmware build and Wokwi simulation
    runs-on: ubuntu-24.04
    env:
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.0.7 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install PubSubClient@2.8 "LiquidCrystal I2C@1.1.2"
      - name: Use the placeholder secret (the real secrets.h is never committed)
        run: cp sketch/secrets.example.h sketch/secrets.h
      - name: Compile
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir sketch/build sketch
      - name: Install Wokwi CLI
        if: env.WOKWI_CLI_TOKEN != ''
        run: curl -L https://wokwi.com/ci/install.sh | sh
      - name: Run Wokwi scenario
        if: env.WOKWI_CLI_TOKEN != ''
        run: ~/.wokwi/bin/wokwi-cli --timeout 120000 --scenario "$GITHUB_WORKSPACE/tests/wokwi/slot_detection.test.yaml" sketch
      - name: Wokwi skipped
        if: env.WOKWI_CLI_TOKEN == ''
        run: echo "::warning::WOKWI_CLI_TOKEN secret not set - firmware compiled but simulation tests were skipped."
